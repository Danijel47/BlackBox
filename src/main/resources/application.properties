spring.application.name=BlackBox

# --- Telegram ---
telegram.blackbox.bot.token=${TELEGRAM_RIO_BOT_TOKEN}
telegram.admin-user-id=${TELEGRAM_ADMIN_USER_ID:0}
telegram.allowed-chat-ids=${TELEGRAM_ALLOWED_CHAT_IDS:}

# Tuesday is the final day before the EU Wednesday weekly reset.
wow.vault-reminder.enabled=${VAULT_REMINDER_ENABLED:true}
wow.vault-reminder.chat-id=${TELEGRAM_VAULT_REMINDER_CHAT_ID:${TELEGRAM_ADMIN_USER_ID:0}}
wow.vault-reminder.cron=${VAULT_REMINDER_CRON:0 0 18 * * TUE}
wow.vault-reminder.zone=${VAULT_REMINDER_ZONE:Europe/Zagreb}

# --- Live WoW class tuning notifications from Wowhead RSS ---
wow.tuning-news.enabled=${WOW_TUNING_NEWS_ENABLED:true}
wow.tuning-news.chat-id=${WOW_TUNING_NEWS_CHAT_ID:${TELEGRAM_VAULT_REMINDER_CHAT_ID:${TELEGRAM_ADMIN_USER_ID:0}}}
wow.tuning-news.feed-url=${WOW_TUNING_NEWS_FEED_URL:https://www.wowhead.com/news/rss/all}
wow.tuning-news.initial-lookback=${WOW_TUNING_NEWS_INITIAL_LOOKBACK:48h}
wow.tuning-news.max-items-per-run=${WOW_TUNING_NEWS_MAX_ITEMS_PER_RUN:3}
wow.tuning-news.cron=${WOW_TUNING_NEWS_CRON:0 */15 * * * *}
wow.tuning-news.zone=${WOW_TUNING_NEWS_ZONE:Europe/Zagreb}

# Warcraft Logs public GraphQL API
warcraft-logs.client-id=${WARCRAFT_LOGS_CLIENT_ID:}
warcraft-logs.client-secret=${WARCRAFT_LOGS_CLIENT_SECRET:}
warcraft-logs.token-url=https://www.warcraftlogs.com/oauth/token
warcraft-logs.api-url=https://www.warcraftlogs.com/api/v2/client
warcraft-logs.recent-report-limit=${WARCRAFT_LOGS_RECENT_REPORT_LIMIT:20}
warcraft-logs.collection-enabled=${WARCRAFT_LOGS_COLLECTION_ENABLED:true}
warcraft-logs.season-key=${WARCRAFT_LOGS_SEASON_KEY:midnight-season-2}
warcraft-logs.season-start=${WARCRAFT_LOGS_SEASON_START:2026-08-19T00:00:00Z}
warcraft-logs.rate-limit-max-percent=${WARCRAFT_LOGS_RATE_LIMIT_MAX_PERCENT:80}
warcraft-logs.refresh-cron=${WARCRAFT_LOGS_REFRESH_CRON:0 5 * * * *}
warcraft-logs.refresh-zone=${WARCRAFT_LOGS_REFRESH_ZONE:Europe/Zagreb}

# --- Postgres datasource ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Keep a persistent current log and one compressed daily archive. Size limits prevent
# unusually noisy periods from consuming unbounded disk space.
logging.file.name=${BLACKBOX_LOG_FILE:logs/blackbox.log}
logging.logback.rollingpolicy.max-history=${BLACKBOX_LOG_MAX_HISTORY:1}
logging.logback.rollingpolicy.max-file-size=${BLACKBOX_LOG_MAX_FILE_SIZE:10MB}
logging.logback.rollingpolicy.total-size-cap=${BLACKBOX_LOG_TOTAL_SIZE_CAP:20MB}
logging.logback.rollingpolicy.clean-history-on-start=true

# General information logs. Telegram debug output is intentionally disabled because
# third-party HTTP diagnostics can contain sensitive request details.
logging.level.root=INFO
logging.level.com.blackbox=${LOGGING_LEVEL_COM_BLACKBOX:INFO}
logging.level.org.telegram.telegrambots=${LOGGING_LEVEL_ORG_TELEGRAM_TELEGRAMBOTS:INFO}

# Private container/VPS health monitoring. Production exposes port 8100 only on localhost.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,diskSpace
management.endpoint.health.group.telegram.include=telegramApi
management.endpoint.health.group.telegram.show-details=never
management.endpoint.health.group.telegram.show-components=never

# manually downloaded Raider.IO abandoned-run snapshots
wow.recap.abandoned-import.directory=helper

blizzard.client-id=${BLIZZARD_CLIENT_ID}
blizzard.client-secret=${BLIZZARD_CLIENT_SECRET}
blizzard.auth-base-url=https://oauth.battle.net
blizzard.api-base-url=https://eu.api.blizzard.com
blizzard.namespace=dynamic-eu
blizzard.locale=en_GB
blizzard.cache.auctions-ttl-seconds=300
blizzard.cache.commodities-ttl-seconds=300
blizzard.cache.realm-ttl-seconds=3600
blizzard.cache.max-auction-rows=${BLIZZARD_CACHE_MAX_AUCTION_ROWS:500000}
blizzard.cache.max-item-entries=${BLIZZARD_CACHE_MAX_ITEM_ENTRIES:1000}
blizzard.cache.max-realm-entries=${BLIZZARD_CACHE_MAX_REALM_ENTRIES:250}

# Keep the unauthenticated HTTP auction endpoints disabled unless explicitly needed.
wow.auction-api.enabled=${AUCTION_API_ENABLED:false}

# travel data
time-to-go.tomtom.api-key=${TOMTOM_API_KEY}
time-to-go.sampling.enabled=true
time-to-go.sampling.cron=0 0,30 * * * *
