spring.application.name=BlackBox

# --- Telegram ---
telegram.blackbox.bot.token=${TELEGRAM_RIO_BOT_TOKEN}
telegram.admin-user-id=${TELEGRAM_ADMIN_USER_ID:0}
telegram.allowed-chat-ids=${TELEGRAM_ALLOWED_CHAT_IDS:}
telegram.daily-prompt.enabled=${TELEGRAM_DAILY_PROMPT_ENABLED:true}
telegram.daily-prompt.target-user-id=${TELEGRAM_DAILY_PROMPT_TARGET_USER_ID:1699671723}
telegram.daily-prompt.chat-id=${TELEGRAM_DAILY_PROMPT_CHAT_ID:${TELEGRAM_VAULT_REMINDER_CHAT_ID:${TELEGRAM_ADMIN_USER_ID:0}}}
telegram.daily-prompt.message=${TELEGRAM_DAILY_PROMPT_MESSAGE:Jope jesi ok?}
telegram.daily-prompt.zone=${TELEGRAM_DAILY_PROMPT_ZONE:Europe/Zagreb}
telegram.gaming-week-countdown.enabled=${TELEGRAM_GAMING_WEEK_COUNTDOWN_ENABLED:true}
telegram.gaming-week-countdown.chat-id=${TELEGRAM_GAMING_WEEK_COUNTDOWN_CHAT_ID:${TELEGRAM_VAULT_REMINDER_CHAT_ID:${TELEGRAM_ADMIN_USER_ID:0}}}
telegram.gaming-week-countdown.target-date=${TELEGRAM_GAMING_WEEK_COUNTDOWN_TARGET_DATE:2026-09-10}
telegram.gaming-week-countdown.cron=${TELEGRAM_GAMING_WEEK_COUNTDOWN_CRON:0 0 10 * * *}
telegram.gaming-week-countdown.zone=${TELEGRAM_GAMING_WEEK_COUNTDOWN_ZONE:Europe/Zagreb}

# Tuesday is the final day before the EU Wednesday weekly reset.
wow.vault-reminder.enabled=${VAULT_REMINDER_ENABLED:true}
wow.vault-reminder.chat-id=${TELEGRAM_VAULT_REMINDER_CHAT_ID:${TELEGRAM_ADMIN_USER_ID:0}}
wow.vault-reminder.cron=${VAULT_REMINDER_CRON:0 0 18 * * TUE}
wow.vault-reminder.zone=${VAULT_REMINDER_ZONE:Europe/Zagreb}

# --- Race to World First: The Venomous Abyss ---
# Update the raid and expansion values when a new raid tier starts.
wow.rwf.enabled=${WOW_RWF_ENABLED:true}
wow.rwf.chat-id=${WOW_RWF_CHAT_ID:${TELEGRAM_VAULT_REMINDER_CHAT_ID:${TELEGRAM_ADMIN_USER_ID:0}}}
wow.rwf.raid-slug=${WOW_RWF_RAID_SLUG:the-venomous-abyss}
wow.rwf.raid-name=${WOW_RWF_RAID_NAME:The Venomous Abyss}
wow.rwf.boss-count=${WOW_RWF_BOSS_COUNT:8}
wow.rwf.expansion-id=${WOW_RWF_EXPANSION_ID:11}
wow.rwf.cron=${WOW_RWF_CRON:0 */2 * * * *}
wow.rwf.zone=${WOW_RWF_ZONE:Europe/Zagreb}

# --- EU WoW Token hourly price history ---
wow.token-history.enabled=${WOW_TOKEN_HISTORY_ENABLED:true}
wow.token-history.backfill-enabled=${WOW_TOKEN_HISTORY_BACKFILL_ENABLED:true}
wow.token-history.backfill-base-url=${WOW_TOKEN_HISTORY_BACKFILL_BASE_URL:https://data.wowtoken.app}
wow.token-history.backfill-cron=${WOW_TOKEN_HISTORY_BACKFILL_CRON:0 15 3 * * *}
wow.token-history.cron=${WOW_TOKEN_HISTORY_CRON:0 0 * * * *}
wow.token-history.zone=${WOW_TOKEN_HISTORY_ZONE:UTC}

wow.mplus-collection.enabled=${WOW_MPLUS_COLLECTION_ENABLED:true}
wow.mplus-collection.max-detail-requests-per-profile=${WOW_MPLUS_COLLECTION_MAX_DETAILS:10}
wow.mplus-collection.retry-max-delay-seconds=${WOW_MPLUS_COLLECTION_RETRY_MAX_DELAY_SECONDS:5}
wow.mplus-collection.cron=${WOW_MPLUS_COLLECTION_CRON:0 */30 * * * *}
wow.mplus-collection.zone=${WOW_MPLUS_COLLECTION_ZONE:Europe/Zagreb}
spring.task.scheduling.pool.size=${SPRING_TASK_SCHEDULING_POOL_SIZE:4}

wow.mplus-progress.reset-zone=${WOW_MPLUS_PROGRESS_RESET_ZONE:UTC}
wow.mplus-progress.reset-day=${WOW_MPLUS_PROGRESS_RESET_DAY:WEDNESDAY}
wow.mplus-progress.reset-time=${WOW_MPLUS_PROGRESS_RESET_TIME:04:00}
wow.mplus-progress.milestones=${WOW_MPLUS_PROGRESS_MILESTONES:1000,2000,2500}

# Weekly profile comparison after the EU Wednesday reset.
wow.mplus-weekly-report.enabled=${WOW_MPLUS_WEEKLY_REPORT_ENABLED:true}
wow.mplus-weekly-report.chat-id=${WOW_MPLUS_WEEKLY_REPORT_CHAT_ID:${TELEGRAM_VAULT_REMINDER_CHAT_ID:${TELEGRAM_ADMIN_USER_ID:0}}}
wow.mplus-weekly-report.cron=${WOW_MPLUS_WEEKLY_REPORT_CRON:0 0 9 * * WED}
wow.mplus-weekly-report.zone=${WOW_MPLUS_WEEKLY_REPORT_ZONE:Europe/Zagreb}

wow.mplus-dungeons.expansion-id=${WOW_MPLUS_DUNGEONS_EXPANSION_ID:11}
wow.mplus-dungeons.target-level=${WOW_MPLUS_DUNGEONS_TARGET_LEVEL:10}
wow.mplus-performance.minimum-sample-size=${WOW_MPLUS_PERFORMANCE_MINIMUM_SAMPLE_SIZE:5}

wow.mplus-team.minimum-shared-runs=${WOW_MPLUS_TEAM_MINIMUM_SHARED_RUNS:3}
wow.mplus-team.maximum-rows=${WOW_MPLUS_TEAM_MAXIMUM_ROWS:5}

wow.mplus-advanced.awards-enabled=${WOW_MPLUS_AWARDS_ENABLED:false}
wow.mplus-advanced.minimum-individual-runs=${WOW_MPLUS_ADVANCED_MINIMUM_INDIVIDUAL_RUNS:10}
wow.mplus-advanced.minimum-shared-runs=${WOW_MPLUS_ADVANCED_MINIMUM_SHARED_RUNS:5}
wow.mplus-advanced.comfort-coverage-percent=${WOW_MPLUS_COMFORT_COVERAGE_PERCENT:70}
wow.mplus-advanced.specialist-minimum-percent=${WOW_MPLUS_SPECIALIST_MINIMUM_PERCENT:40}
wow.mplus-advanced.clutch-window-seconds=${WOW_MPLUS_CLUTCH_WINDOW_SECONDS:60}

wow.mplus-correlation.timestamp-tolerance-seconds=${WOW_MPLUS_MATCH_TIMESTAMP_TOLERANCE_SECONDS:180}
wow.mplus-correlation.duration-tolerance-seconds=${WOW_MPLUS_MATCH_DURATION_TOLERANCE_SECONDS:30}
wow.mplus-correlation.minimum-roster-overlap=${WOW_MPLUS_MATCH_MINIMUM_ROSTER_OVERLAP:4}

# --- Live WoW class tuning notifications from Wowhead RSS ---
wow.tuning-news.enabled=${WOW_TUNING_NEWS_ENABLED:true}
wow.tuning-news.chat-id=${WOW_TUNING_NEWS_CHAT_ID:${TELEGRAM_VAULT_REMINDER_CHAT_ID:${TELEGRAM_ADMIN_USER_ID:0}}}
wow.tuning-news.feed-url=${WOW_TUNING_NEWS_FEED_URL:https://www.wowhead.com/news/rss/all}
wow.tuning-news.initial-lookback=${WOW_TUNING_NEWS_INITIAL_LOOKBACK:48h}
wow.tuning-news.max-items-per-run=${WOW_TUNING_NEWS_MAX_ITEMS_PER_RUN:3}
wow.tuning-news.cron=${WOW_TUNING_NEWS_CRON:0 */15 * * * *}
wow.tuning-news.zone=${WOW_TUNING_NEWS_ZONE:Europe/Zagreb}

# Warcraft Logs public GraphQL API
warcraft-logs.client-id=${WARCRAFT_LOGS_CLIENT_ID:}
warcraft-logs.client-secret=${WARCRAFT_LOGS_CLIENT_SECRET:}
warcraft-logs.token-url=https://www.warcraftlogs.com/oauth/token
warcraft-logs.api-url=https://www.warcraftlogs.com/api/v2/client
warcraft-logs.recent-report-limit=${WARCRAFT_LOGS_RECENT_REPORT_LIMIT:100}
warcraft-logs.collection-enabled=${WARCRAFT_LOGS_COLLECTION_ENABLED:true}
warcraft-logs.season-key=${WARCRAFT_LOGS_SEASON_KEY:midnight-season-2}
warcraft-logs.season-start=${WARCRAFT_LOGS_SEASON_START:2026-08-19T00:00:00Z}
warcraft-logs.rate-limit-max-percent=${WARCRAFT_LOGS_RATE_LIMIT_MAX_PERCENT:80}
# Initial report minimum; a saved admin /mplus_keylevel selection takes precedence.
# Collection retains +12 and higher runs so the admin can switch between +12 and +18.
warcraft-logs.combat-minimum-keystone-level=${WARCRAFT_LOGS_COMBAT_MINIMUM_KEYSTONE_LEVEL:14}
warcraft-logs.refresh-cron=${WARCRAFT_LOGS_REFRESH_CRON:0 0,30 * * * *}
warcraft-logs.refresh-zone=${WARCRAFT_LOGS_REFRESH_ZONE:Europe/Zagreb}

# --- Postgres datasource ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Keep a persistent current log and one compressed daily archive. Size limits prevent
# unusually noisy periods from consuming unbounded disk space.
logging.file.name=${BLACKBOX_LOG_FILE:logs/blackbox.log}
logging.logback.rollingpolicy.max-history=${BLACKBOX_LOG_MAX_HISTORY:1}
logging.logback.rollingpolicy.max-file-size=${BLACKBOX_LOG_MAX_FILE_SIZE:10MB}
logging.logback.rollingpolicy.total-size-cap=${BLACKBOX_LOG_TOTAL_SIZE_CAP:20MB}
logging.logback.rollingpolicy.clean-history-on-start=true

# General information logs. Telegram debug output is intentionally disabled because
# third-party HTTP diagnostics can contain sensitive request details.
logging.level.root=INFO
logging.level.com.blackbox=${LOGGING_LEVEL_COM_BLACKBOX:INFO}
logging.level.org.telegram.telegrambots=${LOGGING_LEVEL_ORG_TELEGRAM_TELEGRAMBOTS:INFO}

# Private container/VPS health monitoring. Production exposes port 8100 only on localhost.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,diskSpace
management.endpoint.health.group.telegram.include=telegramApi
management.endpoint.health.group.telegram.show-details=never
management.endpoint.health.group.telegram.show-components=never

# manually downloaded Raider.IO abandoned-run snapshots
wow.recap.abandoned-import.directory=helper

blizzard.client-id=${BLIZZARD_CLIENT_ID}
blizzard.client-secret=${BLIZZARD_CLIENT_SECRET}
blizzard.auth-base-url=https://oauth.battle.net
blizzard.api-base-url=https://eu.api.blizzard.com
blizzard.namespace=dynamic-eu
blizzard.locale=en_GB
blizzard.cache.auctions-ttl-seconds=300
blizzard.cache.commodities-ttl-seconds=300
blizzard.cache.realm-ttl-seconds=3600
blizzard.cache.max-auction-rows=${BLIZZARD_CACHE_MAX_AUCTION_ROWS:500000}
blizzard.cache.max-item-entries=${BLIZZARD_CACHE_MAX_ITEM_ENTRIES:1000}
blizzard.cache.max-realm-entries=${BLIZZARD_CACHE_MAX_REALM_ENTRIES:250}

# Keep the unauthenticated HTTP auction endpoints disabled unless explicitly needed.
wow.auction-api.enabled=${AUCTION_API_ENABLED:false}

# Admin-only housing market report. TSM regional data is refreshed daily and the
# Blizzard decor catalog changes far less often, so keep both cached in memory.
wow.housing-market.result-limit=${WOW_HOUSING_RESULT_LIMIT:10}
wow.housing-market.tsm-cache-hours=${WOW_HOUSING_TSM_CACHE_HOURS:12}
wow.housing-market.catalog-cache-hours=${WOW_HOUSING_CATALOG_CACHE_HOURS:24}

# travel data
time-to-go.tomtom.api-key=${TOMTOM_API_KEY}
time-to-go.sampling.enabled=true
time-to-go.sampling.cron=0 0,30 * * * *
