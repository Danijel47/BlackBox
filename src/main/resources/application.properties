spring.application.name=BlackBox

# --- Telegram ---
telegram.rio.bot.token=${TELEGRAM_RIO_BOT_TOKEN}

# --- Postgres datasource ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# general info logs
logging.level.root=INFO

# detailed telegram logs
logging.level.com.example.blackbox=DEBUG
logging.level.org.telegram.telegrambots=DEBUG

blizzard.client-id=${BLIZZARD_CLIENT_ID}
blizzard.client-secret=${BLIZZARD_CLIENT_SECRET}
blizzard.auth-base-url=https://oauth.battle.net
blizzard.api-base-url=https://eu.api.blizzard.com
blizzard.namespace=dynamic-eu
blizzard.locale=en_GB
blizzard.cache.auctions-ttl-seconds=300
blizzard.cache.commodities-ttl-seconds=300
blizzard.cache.realm-ttl-seconds=3600

# travel data
time-to-go.tomtom.api-key=${TOMTOM_API_KEY}
time-to-go.sampling.enabled=true
time-to-go.sampling.cron=0 0,30 * * * *
