services:
  bot:
    build: .
    image: blackbox:latest
    container_name: blackbox
    environment:
      TELEGRAM_RIO_BOT_TOKEN: ${TELEGRAM_RIO_BOT_TOKEN}
      TELEGRAM_ADMIN_USER_ID: ${TELEGRAM_ADMIN_USER_ID:-0}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      TELEGRAM_VAULT_REMINDER_CHAT_ID: ${TELEGRAM_VAULT_REMINDER_CHAT_ID:-${TELEGRAM_ADMIN_USER_ID:-0}}
      TELEGRAM_GAMING_WEEK_COUNTDOWN_ENABLED: ${TELEGRAM_GAMING_WEEK_COUNTDOWN_ENABLED:-true}
      TELEGRAM_GAMING_WEEK_COUNTDOWN_CHAT_ID: ${TELEGRAM_GAMING_WEEK_COUNTDOWN_CHAT_ID:-${TELEGRAM_VAULT_REMINDER_CHAT_ID:-${TELEGRAM_ADMIN_USER_ID:-0}}}
      TELEGRAM_GAMING_WEEK_COUNTDOWN_TARGET_DATE: ${TELEGRAM_GAMING_WEEK_COUNTDOWN_TARGET_DATE:-2026-09-10}
      TELEGRAM_GAMING_WEEK_COUNTDOWN_CRON: "${TELEGRAM_GAMING_WEEK_COUNTDOWN_CRON:-0 0 10 * * *}"
      TELEGRAM_GAMING_WEEK_COUNTDOWN_ZONE: ${TELEGRAM_GAMING_WEEK_COUNTDOWN_ZONE:-Europe/Zagreb}
      VAULT_REMINDER_ENABLED: ${VAULT_REMINDER_ENABLED:-true}
      WOW_RWF_ENABLED: ${WOW_RWF_ENABLED:-true}
      WOW_RWF_CHAT_ID: ${WOW_RWF_CHAT_ID:-${TELEGRAM_VAULT_REMINDER_CHAT_ID:-${TELEGRAM_ADMIN_USER_ID:-0}}}
      WOW_RWF_RAID_SLUG: ${WOW_RWF_RAID_SLUG:-the-venomous-abyss}
      WOW_RWF_RAID_NAME: ${WOW_RWF_RAID_NAME:-The Venomous Abyss}
      WOW_RWF_BOSS_COUNT: ${WOW_RWF_BOSS_COUNT:-8}
      WOW_RWF_EXPANSION_ID: ${WOW_RWF_EXPANSION_ID:-11}
      WOW_RWF_CRON: "${WOW_RWF_CRON:-0 */2 * * * *}"
      WOW_RWF_ZONE: ${WOW_RWF_ZONE:-Europe/Zagreb}
      WOW_TUNING_NEWS_ENABLED: ${WOW_TUNING_NEWS_ENABLED:-true}
      WOW_TUNING_NEWS_CHAT_ID: ${WOW_TUNING_NEWS_CHAT_ID:-${TELEGRAM_VAULT_REMINDER_CHAT_ID:-${TELEGRAM_ADMIN_USER_ID:-0}}}
      WOW_TUNING_NEWS_INITIAL_LOOKBACK: ${WOW_TUNING_NEWS_INITIAL_LOOKBACK:-48h}
      WOW_TUNING_NEWS_MAX_ITEMS_PER_RUN: ${WOW_TUNING_NEWS_MAX_ITEMS_PER_RUN:-3}
      WOW_TUNING_NEWS_CRON: "${WOW_TUNING_NEWS_CRON:-0 */15 * * * *}"
      WOW_TUNING_NEWS_ZONE: ${WOW_TUNING_NEWS_ZONE:-Europe/Zagreb}
      WARCRAFT_LOGS_CLIENT_ID: ${WARCRAFT_LOGS_CLIENT_ID:-}
      WARCRAFT_LOGS_CLIENT_SECRET: ${WARCRAFT_LOGS_CLIENT_SECRET:-}
      WARCRAFT_LOGS_RECENT_REPORT_LIMIT: ${WARCRAFT_LOGS_RECENT_REPORT_LIMIT:-20}
      WARCRAFT_LOGS_COLLECTION_ENABLED: ${WARCRAFT_LOGS_COLLECTION_ENABLED:-true}
      WARCRAFT_LOGS_SEASON_KEY: ${WARCRAFT_LOGS_SEASON_KEY:-midnight-season-2}
      WARCRAFT_LOGS_SEASON_START: ${WARCRAFT_LOGS_SEASON_START:-2026-08-19T00:00:00Z}
      WARCRAFT_LOGS_RATE_LIMIT_MAX_PERCENT: ${WARCRAFT_LOGS_RATE_LIMIT_MAX_PERCENT:-80}
      WARCRAFT_LOGS_REFRESH_CRON: "${WARCRAFT_LOGS_REFRESH_CRON:-0 5 * * * *}"
      WARCRAFT_LOGS_REFRESH_ZONE: ${WARCRAFT_LOGS_REFRESH_ZONE:-Europe/Zagreb}
      WOW_MPLUS_COLLECTION_ENABLED: ${WOW_MPLUS_COLLECTION_ENABLED:-true}
      WOW_MPLUS_COLLECTION_MAX_DETAILS: ${WOW_MPLUS_COLLECTION_MAX_DETAILS:-10}
      WOW_MPLUS_COLLECTION_RETRY_MAX_DELAY_SECONDS: ${WOW_MPLUS_COLLECTION_RETRY_MAX_DELAY_SECONDS:-5}
      WOW_MPLUS_COLLECTION_CRON: "${WOW_MPLUS_COLLECTION_CRON:-0 */30 * * * *}"
      WOW_MPLUS_COLLECTION_ZONE: ${WOW_MPLUS_COLLECTION_ZONE:-Europe/Zagreb}
      WOW_MPLUS_AWARDS_ENABLED: ${WOW_MPLUS_AWARDS_ENABLED:-false}
      WOW_MPLUS_ADVANCED_MINIMUM_INDIVIDUAL_RUNS: ${WOW_MPLUS_ADVANCED_MINIMUM_INDIVIDUAL_RUNS:-10}
      WOW_MPLUS_ADVANCED_MINIMUM_SHARED_RUNS: ${WOW_MPLUS_ADVANCED_MINIMUM_SHARED_RUNS:-5}
      WOW_MPLUS_COMFORT_COVERAGE_PERCENT: ${WOW_MPLUS_COMFORT_COVERAGE_PERCENT:-70}
      WOW_MPLUS_SPECIALIST_MINIMUM_PERCENT: ${WOW_MPLUS_SPECIALIST_MINIMUM_PERCENT:-40}
      WOW_MPLUS_CLUTCH_WINDOW_SECONDS: ${WOW_MPLUS_CLUTCH_WINDOW_SECONDS:-60}
      BLIZZARD_CACHE_MAX_AUCTION_ROWS: ${BLIZZARD_CACHE_MAX_AUCTION_ROWS:-500000}
      BLIZZARD_CACHE_MAX_ITEM_ENTRIES: ${BLIZZARD_CACHE_MAX_ITEM_ENTRIES:-1000}
      BLIZZARD_CACHE_MAX_REALM_ENTRIES: ${BLIZZARD_CACHE_MAX_REALM_ENTRIES:-250}
      AUCTION_API_ENABLED: ${AUCTION_API_ENABLED:-false}
      BLIZZARD_CLIENT_ID: ${BLIZZARD_CLIENT_ID}
      BLIZZARD_CLIENT_SECRET: ${BLIZZARD_CLIENT_SECRET}
      TOMTOM_API_KEY: ${TOMTOM_API_KEY}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      BLACKBOX_LOG_FILE: /app/logs/blackbox.log
      BLACKBOX_LOG_MAX_HISTORY: ${BLACKBOX_LOG_MAX_HISTORY:-1}
      BLACKBOX_LOG_MAX_FILE_SIZE: ${BLACKBOX_LOG_MAX_FILE_SIZE:-10MB}
      BLACKBOX_LOG_TOTAL_SIZE_CAP: ${BLACKBOX_LOG_TOTAL_SIZE_CAP:-20MB}
      LOGGING_LEVEL_COM_BLACKBOX: ${LOGGING_LEVEL_COM_BLACKBOX:-INFO}
      LOGGING_LEVEL_ORG_TELEGRAM_TELEGRAMBOTS: ${LOGGING_LEVEL_ORG_TELEGRAM_TELEGRAMBOTS:-INFO}
      SPRING_TASK_SCHEDULING_POOL_SIZE: ${SPRING_TASK_SCHEDULING_POOL_SIZE:-4}
    ports:
      - "127.0.0.1:8100:8100"
    volumes:
      - ./helper:/app/helper:ro
      - ./logs:/app/logs
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "2"
